name: Core CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test -p vigo-core --release --test performance -- --ignored --nocapture

  native-macos:
    name: C ABI and legacy oracle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build -p vigo-core
      - run: mkdir -p build && xcrun clang -std=c11 -Wall -Wextra -Werror -Icore/include core/tests/ffi_smoke.c target/debug/libvigo_core.a -o build/ffi-smoke
      - run: ./build/ffi-smoke
      - run: make -C legacy/oracle
      - run: test "$(build/legacy-oracle telex tieengs)" = "tiếng"
      - run: rustup target add x86_64-apple-darwin
      - run: swift format lint --recursive --strict platform/macos/Sources platform/macos/Tests
      - run: swift format lint --strict platform/macos/scripts/input-source-tool.swift
      - run: find platform/macos/scripts -name '*.sh' -exec sh -n {} \;
      - run: swift test --package-path platform/macos
      - run: platform/macos/scripts/package-app.sh

  native-windows:
    name: Windows TSF x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build -p vigo-core
      - run: cmake -S platform/windows -B build/windows -A x64 -DBUILD_TESTING=ON
      - run: cmake --build build/windows --config Debug
      - run: ctest --test-dir build/windows -C Debug --output-on-failure
      - run: platform/windows/scripts/verify-build.ps1
      - name: Build unsigned MSI
        if: vars.WIX_EULA_ACCEPTED == 'wix7'
        run: >-
          dotnet build platform/windows/installer/ViGo.wixproj
          -c Debug
          -p:AcceptEula=${{ vars.WIX_EULA_ACCEPTED }}
          -p:ViGoBuildDir=${{ github.workspace }}/build/windows/Debug

  native-linux-ubuntu:
    name: Linux IBus and Fcitx5 (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          ninja-build pkg-config libibus-1.0-dev libfcitx5core-dev
          libfcitx5config-dev libfcitx5utils-dev extra-cmake-modules
      - run: cargo build -p vigo-core --release
      - run: >-
          cmake -S platform/linux -B build/linux -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=ON
          -DVIGO_CORE_LIBRARY=${{ github.workspace }}/target/release/libvigo_core.a
          -DVIGO_BUILD_IBUS=ON -DVIGO_BUILD_FCITX5=ON
      - run: cmake --build build/linux
      - run: ctest --test-dir build/linux --output-on-failure
      - run: cpack --config build/linux/CPackConfig.cmake -G DEB -B dist/linux
      - run: find dist/linux -name '*.deb' -exec dpkg-deb --info {} \;
      - run: find dist/linux -name '*.deb' -exec dpkg-deb --contents {} \;
      - run: sudo apt-get install -y --no-install-recommends ./dist/linux/*.deb
      - run: dpkg --listfiles vigo-ibus && dpkg --listfiles vigo-fcitx5
      - run: sudo dpkg --remove vigo-ibus vigo-fcitx5
      - run: test ! -e /usr/libexec/ibus-engine-vigo && test ! -e /usr/lib/*/fcitx5/vigo.so

  native-linux-fedora:
    name: Linux IBus and Fcitx5 (Fedora 44)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v7
      - run: >-
          dnf install -y gcc-c++ cmake ninja-build pkgconf-pkg-config
          ibus-devel fcitx5-devel extra-cmake-modules rpm-build rustup
      # Fedora's rustup package ships only rustup-init.
      - run: rustup-init -y --default-toolchain 1.98.0 --profile minimal
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build -p vigo-core --release
      - run: >-
          cmake -S platform/linux -B build/linux-fedora -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=ON
          -DVIGO_CORE_LIBRARY=$GITHUB_WORKSPACE/target/release/libvigo_core.a
          -DVIGO_BUILD_IBUS=ON -DVIGO_BUILD_FCITX5=ON
      - run: cmake --build build/linux-fedora
      - run: ctest --test-dir build/linux-fedora --output-on-failure
      - run: cpack --config build/linux-fedora/CPackConfig.cmake -G RPM -B dist/linux
      - run: find dist/linux -name '*.rpm' -exec rpm -qip {} \;
      - run: find dist/linux -name '*.rpm' -exec rpm -qlp {} \;
      - run: dnf install -y --setopt=install_weak_deps=False dist/linux/*.rpm
      - run: rpm -ql vigo-ibus && rpm -ql vigo-fcitx5
      - run: rpm -e vigo-ibus vigo-fcitx5
      - run: test ! -e /usr/libexec/ibus-engine-vigo && test ! -e /usr/lib64/fcitx5/vigo.so
